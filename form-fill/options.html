<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dev Fill profile</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <main>
    <h1>Dev Fill</h1>
    <p class="sub">Saved on this computer. New questions from the seed are added without replacing answers you edited.</p>

    <h2>Profile</h2>
    <div id="fields" class="grid"></div>

    <h2>Saved answers</h2>
    <div id="answers"></div>
    <button id="add" class="ghost" type="button">Add answer</button>

    <div class="row">
      <button id="save" type="button">Save</button>
      <span id="status"></span>
    </div>
  </main>
  <script src="seed.js"></script>
  <script src="storage.js"></script>
  <script src="options.js"></script>
</body>
</html>
